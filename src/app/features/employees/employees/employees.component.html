<div class="page-header">

  <div>
    <h1>Employees</h1>
    <p>Manage your employees</p>
  </div>

  <button
    mat-raised-button
    color="primary">
    Add Employee
  </button>

</div>


<div class="table-container">

  <table
    mat-table
    [dataSource]="employees"
    class="employee-table">

    <!-- ID -->
    <ng-container matColumnDef="id">

      <th
        mat-header-cell
        *matHeaderCellDef>
        ID
      </th>

      <td
        mat-cell
        *matCellDef="let employee">
        {{ employee.id }}
      </td>

    </ng-container>


    <!-- Employee Name -->
    <ng-container matColumnDef="employeeName">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Employee
      </th>

      <td
        mat-cell
        *matCellDef="let employee">

        {{ employee.employeeName }}

      </td>

    </ng-container>


    <!-- Email -->
    <ng-container matColumnDef="email">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Email
      </th>

      <td
        mat-cell
        *matCellDef="let employee">

        {{ employee.email }}

      </td>

    </ng-container>


    <!-- Department -->
    <ng-container matColumnDef="department">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Department
      </th>

      <td
        mat-cell
        *matCellDef="let employee">

        {{ employee.department }}

      </td>

    </ng-container>


    <!-- Salary -->
    <ng-container matColumnDef="salary">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Salary
      </th>

      <td
        mat-cell
        *matCellDef="let employee">

        ₹{{ employee.salary | number }}

      </td>

    </ng-container>


    <!-- Actions -->
    <ng-container matColumnDef="actions">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Actions
      </th>

      <td
        mat-cell
        *matCellDef="let employee">

        <button
          mat-button
          color="primary">
          Edit
        </button>

        <button
          mat-button
          color="warn">
          Delete
        </button>

      </td>

    </ng-container>


    <!-- Header -->
    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>


    <!-- Rows -->
    <tr
      mat-row
      *matRowDef="
        let row;
        columns: displayedColumns;
      ">
    </tr>

  </table>

</div>
