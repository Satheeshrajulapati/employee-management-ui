<div class="change-password-container">

  <mat-card class="change-password-card">

    <mat-card-header>
      <mat-card-title>
        Change Password
      </mat-card-title>

      <mat-card-subtitle>
        Please update your temporary password
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <form
        [formGroup]="changePasswordForm"
        (ngSubmit)="changePassword()">

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>
            Current Password
          </mat-label>

          <input
            matInput
            formControlName="currentPassword"
            [type]="
              hideCurrentPassword
                ? 'password'
                : 'text'
            ">

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="
              hideCurrentPassword =
                !hideCurrentPassword
            ">

            <mat-icon>
              {{
                hideCurrentPassword
                  ? 'visibility_off'
                  : 'visibility'
              }}
            </mat-icon>

          </button>

          <mat-error
            *ngIf="
              changePasswordForm
                .controls
                .currentPassword
                .hasError('required')
            ">

            Current password is required

          </mat-error>

        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>
            New Password
          </mat-label>

          <input
            matInput
            formControlName="newPassword"
            [type]="
              hideNewPassword
                ? 'password'
                : 'text'
            ">

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="
              hideNewPassword =
                !hideNewPassword
            ">

            <mat-icon>
              {{
                hideNewPassword
                  ? 'visibility_off'
                  : 'visibility'
              }}
            </mat-icon>

          </button>

          <mat-error
            *ngIf="
              changePasswordForm
                .controls
                .newPassword
                .hasError('required')
            ">

            New password is required

          </mat-error>

          <mat-error
            *ngIf="
              changePasswordForm
                .controls
                .newPassword
                .hasError('minlength')
            ">

            Password must be at least 8 characters

          </mat-error>

        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>
            Confirm New Password
          </mat-label>

          <input
            matInput
            formControlName="confirmPassword"
            [type]="
              hideConfirmPassword
                ? 'password'
                : 'text'
            ">

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="
              hideConfirmPassword =
                !hideConfirmPassword
            ">

            <mat-icon>
              {{
                hideConfirmPassword
                  ? 'visibility_off'
                  : 'visibility'
              }}
            </mat-icon>

          </button>

          <mat-error
            *ngIf="
              changePasswordForm
                .controls
                .confirmPassword
                .hasError('required')
            ">

            Confirm password is required

          </mat-error>

        </mat-form-field>

        <button
          mat-raised-button
          type="submit"
          class="full-width"
          [disabled]="loading">

          <mat-spinner
            *ngIf="loading"
            diameter="20">
          </mat-spinner>

          <span *ngIf="!loading">
            Change Password
          </span>

        </button>

      </form>

    </mat-card-content>

  </mat-card>

</div>
